<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skinGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c4a0"/>
      <stop offset="100%" style="stop-color:#e8a882"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="#e8f4f8"/>

  <!-- Wall -->
  <rect x="200" y="10" width="15" height="180" fill="#888"/>
  <rect x="200" y="10" width="15" height="180" fill="url(#wallPattern)" opacity="0.3"/>

  <!-- Floor -->
  <rect x="20" y="180" width="260" height="4" rx="2" fill="#ccc"/>

  <!-- Person doing wall sit -->
  <g>
    <!-- Head -->
    <circle cx="180" cy="45" r="15" fill="url(#skinGrad4)"/>

    <!-- Hair -->
    <ellipse cx="180" cy="38" rx="12" ry="8" fill="#5d4e37"/>

    <!-- Torso against wall -->
    <rect x="160" y="55" width="35" height="50" rx="10" fill="#4a90d9"/>

    <!-- Upper legs (horizontal) -->
    <rect x="115" y="100" width="50" height="22" rx="10" fill="url(#skinGrad4)"/>
    <rect x="115" y="100" width="50" height="22" rx="10" fill="url(#skinGrad4)"/>

    <!-- Lower legs (vertical) -->
    <rect x="115" y="118" width="18" height="55" rx="8" fill="url(#skinGrad4)"/>
    <rect x="145" y="118" width="18" height="55" rx="8" fill="url(#skinGrad4)"/>

    <!-- Feet -->
    <ellipse cx="110" cy="175" rx="18" ry="7" fill="#555"/>
    <ellipse cx="160" cy="175" rx="18" ry="7" fill="#555"/>

    <!-- Arms at sides -->
    <rect x="155" y="60" width="10" height="40" rx="5" fill="url(#skinGrad4)"/>
    <rect x="190" y="60" width="10" height="40" rx="5" fill="url(#skinGrad4)"/>
  </g>

  <!-- 90 degree angle indicator -->
  <path d="M135 100 L135 118 L150 118" stroke="#4caf50" stroke-width="2" fill="none"/>
  <text x="142" y="112" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">90°</text>

  <!-- Left leg emphasis (weight bias) -->
  <path d="M75 160 L100 170" stroke="#ff9800" stroke-width="2" fill="none"/>
  <polygon points="98 166, 105 172, 96 174" fill="#ff9800"/>
  <text x="45" y="155" font-family="Arial, sans-serif" font-size="9" fill="#ff9800">Bias left</text>

  <!-- Text label -->
  <text x="130" y="195" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Hold with thighs parallel to floor</text>
</svg>
