<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c4a0"/>
      <stop offset="100%" style="stop-color:#e8a882"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="#e8f4f8"/>

  <!-- Floor -->
  <rect x="20" y="165" width="260" height="4" rx="2" fill="#ccc"/>

  <!-- Mat -->
  <rect x="40" y="160" width="180" height="8" rx="2" fill="#9c88ff"/>

  <!-- Person doing bridge -->
  <g>
    <!-- Head -->
    <circle cx="55" cy="145" r="12" fill="url(#skinGrad2)"/>

    <!-- Upper back/shoulders on ground -->
    <ellipse cx="80" cy="152" rx="25" ry="10" fill="#4a90d9"/>

    <!-- Torso lifted -->
    <path d="M95 145 Q140 100 160 120" stroke="#4a90d9" stroke-width="24" fill="none" stroke-linecap="round"/>

    <!-- Planted leg (bent) -->
    <g>
      <!-- Upper leg -->
      <rect x="155" y="115" width="20" height="40" rx="10" fill="url(#skinGrad2)" transform="rotate(45 165 135)"/>
      <!-- Lower leg -->
      <rect x="185" y="130" width="16" height="35" rx="8" fill="url(#skinGrad2)" transform="rotate(-5 193 147)"/>
      <!-- Foot on ground -->
      <ellipse cx="188" cy="162" rx="15" ry="6" fill="#555"/>
    </g>

    <!-- Extended leg (in air) -->
    <g>
      <!-- Upper leg -->
      <rect x="155" y="108" width="20" height="40" rx="10" fill="url(#skinGrad2)" transform="rotate(-5 165 128)"/>
      <!-- Lower leg extended -->
      <rect x="190" y="100" width="16" height="45" rx="8" fill="url(#skinGrad2)" transform="rotate(-5 198 122)"/>
      <!-- Foot -->
      <ellipse cx="232" cy="98" rx="12" ry="6" fill="#555" transform="rotate(-5 232 98)"/>
    </g>

    <!-- Arms on ground -->
    <rect x="70" y="155" width="35" height="8" rx="4" fill="url(#skinGrad2)"/>
    <rect x="60" y="155" width="35" height="8" rx="4" fill="url(#skinGrad2)" transform="rotate(10 77 159)"/>
  </g>

  <!-- Arrow showing hip lift -->
  <path d="M130 140 L130 110" stroke="#4caf50" stroke-width="3" fill="none"/>
  <polygon points="125 112, 130 100, 135 112" fill="#4caf50"/>

  <!-- Text label -->
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Lift hips with one leg extended</text>
</svg>
