<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skinGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c4a0"/>
      <stop offset="100%" style="stop-color:#e8a882"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="#e8f4f8"/>

  <!-- Floor -->
  <rect x="20" y="175" width="260" height="4" rx="2" fill="#ccc"/>

  <!-- Anchor point -->
  <rect x="30" y="140" width="15" height="40" rx="3" fill="#666"/>
  <circle cx="37" cy="150" r="5" fill="#444"/>

  <!-- Resistance band -->
  <path d="M42 150 Q80 145 120 120 Q140 105 145 85" stroke="#e53935" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="145" cy="82" rx="12" ry="8" fill="#e53935" opacity="0.7"/>

  <!-- Person doing knee drive -->
  <g transform="translate(100, 0)">
    <!-- Head -->
    <circle cx="80" cy="35" r="18" fill="url(#skinGrad6)"/>

    <!-- Torso - slightly leaning forward -->
    <rect x="62" y="48" width="38" height="60" rx="14" fill="#4a90d9" transform="rotate(-5 80 78)"/>

    <!-- Arms for balance -->
    <rect x="45" y="55" width="12" height="40" rx="6" fill="url(#skinGrad6)" transform="rotate(-20 51 75)"/>
    <rect x="95" y="55" width="12" height="40" rx="6" fill="url(#skinGrad6)" transform="rotate(20 101 75)"/>

    <!-- Standing leg (slightly bent) -->
    <rect x="70" y="105" width="20" height="60" rx="9" fill="url(#skinGrad6)" transform="rotate(5 80 135)"/>
    <ellipse cx="85" cy="172" rx="20" ry="8" fill="#555"/>

    <!-- Driving knee (raised) -->
    <!-- Thigh -->
    <rect x="55" y="100" width="20" height="45" rx="9" fill="url(#skinGrad6)" transform="rotate(-60 65 122)"/>
    <!-- Lower leg (tucked) -->
    <rect x="30" y="70" width="16" height="40" rx="8" fill="url(#skinGrad6)" transform="rotate(30 38 90)"/>
    <!-- Foot with band -->
    <ellipse cx="45" cy="82" rx="15" ry="7" fill="#555" transform="rotate(-20 45 82)"/>
  </g>

  <!-- Motion arrow -->
  <g transform="translate(180, 60)">
    <path d="M0 30 L0 0" stroke="#4caf50" stroke-width="3" fill="none"/>
    <polygon points="-6 5, 0 -8, 6 5" fill="#4caf50"/>
  </g>

  <!-- Labels -->
  <text x="55" y="135" font-family="Arial, sans-serif" font-size="9" fill="#e53935" font-weight="bold">Band</text>
  <text x="185" y="45" font-family="Arial, sans-serif" font-size="9" fill="#4caf50">Drive up</text>

  <!-- Text label -->
  <text x="150" y="192" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Drive knee up against band resistance</text>
</svg>
