<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skinGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c4a0"/>
      <stop offset="100%" style="stop-color:#e8a882"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="#e8f4f8"/>

  <!-- Wall/Support -->
  <rect x="70" y="20" width="8" height="160" rx="2" fill="#888"/>

  <!-- Floor -->
  <rect x="20" y="180" width="260" height="4" rx="2" fill="#ccc"/>

  <!-- Person doing leg swings -->
  <g>
    <!-- Head -->
    <circle cx="115" cy="40" r="15" fill="url(#skinGrad5)"/>

    <!-- Torso -->
    <rect x="98" y="50" width="35" height="55" rx="12" fill="#4a90d9"/>

    <!-- Arm holding wall -->
    <rect x="78" y="55" width="25" height="10" rx="5" fill="url(#skinGrad5)"/>
    <circle cx="78" cy="60" r="5" fill="url(#skinGrad5)"/>

    <!-- Other arm -->
    <rect x="128" y="55" width="10" height="35" rx="5" fill="url(#skinGrad5)" transform="rotate(15 133 72)"/>

    <!-- Standing leg -->
    <rect x="108" y="100" width="18" height="70" rx="8" fill="url(#skinGrad5)"/>
    <ellipse cx="115" cy="177" rx="18" ry="7" fill="#555"/>

    <!-- Swinging leg - current position -->
    <rect x="125" y="95" width="18" height="60" rx="8" fill="url(#skinGrad5)" transform="rotate(-30 134 125)" opacity="1"/>
    <ellipse cx="160" cy="145" rx="15" ry="6" fill="#555" transform="rotate(-30 160 145)"/>

    <!-- Ghost positions showing swing motion -->
    <rect x="125" y="95" width="18" height="60" rx="8" fill="url(#skinGrad5)" transform="rotate(30 134 125)" opacity="0.3"/>
    <rect x="125" y="95" width="18" height="60" rx="8" fill="url(#skinGrad5)" transform="rotate(0 134 125)" opacity="0.3"/>
  </g>

  <!-- Motion arc -->
  <path d="M160 145 A 50 50 0 0 1 160 175" stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="4"/>
  <path d="M160 145 A 50 50 0 0 0 180 120" stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="4"/>

  <!-- Direction arrows -->
  <g transform="translate(200, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#666">Forward/Back</text>
    <path d="M20 10 L20 40" stroke="#4caf50" stroke-width="2"/>
    <polygon points="15 38, 20 48, 25 38" fill="#4caf50"/>
    <polygon points="15 12, 20 2, 25 12" fill="#4caf50"/>
  </g>

  <g transform="translate(200, 140)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" fill="#666">Side to Side</text>
    <path d="M10 15 L50 15" stroke="#ff9800" stroke-width="2"/>
    <polygon points="12 10, 2 15, 12 20" fill="#ff9800"/>
    <polygon points="48 10, 58 15, 48 20" fill="#ff9800"/>
  </g>

  <!-- Text label -->
  <text x="130" y="195" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Swing leg in controlled motion</text>
</svg>
