<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#357abd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Stylized knee/leg icon -->
  <g transform="translate(100, 80)">
    <!-- Upper leg -->
    <rect x="100" y="0" width="70" height="160" rx="35" fill="white" opacity="0.95"/>

    <!-- Knee joint -->
    <circle cx="135" cy="170" r="50" fill="white" opacity="0.95"/>
    <circle cx="135" cy="170" r="25" fill="#4a90d9"/>

    <!-- Lower leg -->
    <rect x="100" y="180" width="70" height="150" rx="35" fill="white" opacity="0.95"/>
  </g>

  <!-- Checkmark overlay -->
  <g transform="translate(280, 280)">
    <circle cx="60" cy="60" r="70" fill="#4caf50"/>
    <path d="M30 60 L55 85 L95 35" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
